name: xid
description: |
  Xid is a globally unique id generator. Xids are small, fast to generate, sortable, 
  compact URL-safe string with no configuration or central generator server.
  
version: 1.2.2
repository: https://github.com/pitabwire/xid
environment:
  sdk: '>=3.8.0 <4.0.0'

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.0
